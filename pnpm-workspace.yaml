
minimumReleaseAgeExcludePrune: true
# semver@6.3.1 等经典包在 no-downgrade 策略下误报（发布于 provenance 机制之前）
minimumReleaseAgeExclude:
  - semver
# off：renton 默认的 no-downgrade 会将 semver@6.3.1 等发布于 provenance 机制
# 之前的经典包误判为"信任降级"，阻断一切增量安装（pnpm discussion #10706）；
# eslint.config.ts 中已同步覆盖 pnpm/yaml-enforce-settings 的期望值
trustPolicy: off
shellEmulator: true
verifyDepsBeforeRun: false

packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-start':
    skills: true

# .claude/ 未纳入版本库，CI 中该目录不存在会导致 ERR_PNPM_NO_AGENT_SKILLS_DIR
skills:
  dirs:
    - .claude/skills
