name: Deploy website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Cancel in-flight runs for the same ref when a new run starts
concurrency:
  group: deploy-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # 站点绝对 URL：Astro 的 canonical/sitemap 依赖它，turbo 已声明该 env 参与缓存键
      SITE_URL: ${{ vars.SITE_URL || 'https://tennantite.rikka.cc' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro 构建用 SWC 剥离类型不做类型检查，构建不会暴露类型错误，因此先过一遍质量门禁
      - name: Quality gate (lint + typecheck)
        run: |
          pnpm lint
          pnpm typecheck

      # `...` 一并构建 @tennantite/website 依赖的工作区包（ui / tokens / textures）
      - name: Build website
        run: pnpm turbo run build --filter=@tennantite/website...

      # PR 只做门禁 + 构建校验，不发布
      # 项目生产别名指向 production branch 的最新部署；显式对齐为 master，避免 master 部署只落在分支别名
      - name: Ensure production branch is master
        if: github.event_name != 'pull_request'
        run: |
          curl -sfX PATCH "https://api.cloudflare.com/client/v4/accounts/${{ secrets.ACCOUNT_ID }}/pages/projects/tennantite" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"master"}'

      - name: Publish to CF Pages tennantite
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 10
          command: npx --yes wrangler@4.142.0 pages deploy apps/website/dist --project-name=tennantite --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
