name: pages-inspect

on:
  workflow_dispatch:
    inputs:
      set_production_master:
        description: "align project production branch to master"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read project
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.ACCOUNT_ID }}
          SET: ${{ inputs.set_production_master }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/verdigris-ui"
          echo "== before =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$api" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,name:j.result?.name,production_branch:j.result?.production_branch,subdomain:j.result?.subdomain,domains:j.result?.domains,source:j.result?.source?.type},null,2))})'
          if [ "$SET" = "true" ]; then
            echo "== set production_branch=master =="
            curl -sS -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d '{"production_branch":"master"}' "$api" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,production_branch:j.result?.production_branch},null,2))})'
          fi
